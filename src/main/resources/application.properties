spring.application.name=priorizasus

# ── Admin credentials (Spring Security in-memory) ──
# ⚠️ Phase 2: Multi-user auth. Hardcoded single user for Phase 1 MVP.
app.admin.username=admin
app.admin.password=PRIORIZASUS2026

# ── SMTP (transactional booking-link emails) ──
# ⚠️ Phase 2: Email notifications are out-of-scope per ADR-0004.
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=${MAIL_USERNAME:}
# spring.mail.password=${MAIL_PASSWORD:}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# H2 In-Memory Database (Development)
spring.datasource.url=jdbc:h2:mem:priorizasus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL Configuration (Production)
# spring.datasource.url=jdbc:postgresql://localhost:5432/priorizasus
# spring.datasource.username=postgres
# spring.datasource.password=YOUR_PASSWORD
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Timezone per ADR-0003
spring.jackson.time-zone=UTC

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8

# ── Clinic Schedule (CM-002, WeekConfig) ──
clinic.schedule.days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY
clinic.schedule.open-time=08:00
clinic.schedule.close-time=17:00
clinic.schedule.slot-duration-minutes=30
clinic.schedule.slots-per-day=8
clinic.schedule.total-weekly-slots=40
clinic.schedule.morning-only=true

# ── Clinic Holidays (CM-002 edge case) ──
# Comma-separated yyyy-MM-dd. Empty = no holidays.
clinic.holidays.dates=

# ── SpringDoc OpenAPI / Swagger UI ──
springdoc.api-docs.path=/v3/api-docs
# Custom Swagger UI page at /swagger-ui/index.html (pre-filled auth via static resource)
springdoc.swagger-ui.enabled=false
springdoc.show-login-endpoint=false

# Logging
logging.level.root=INFO
logging.level.com.priorizasus=DEBUG
