<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<th:block th:fragment="content">
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold" style="color: var(--agn-stone);">404</div>
    <i class="bi bi-emoji-frown display-3 mb-3" style="color: var(--agn-steel);"></i>
    <h3>Página não encontrada</h3>
    <p style="color: var(--agn-steel);">
      A página que você procura não existe ou foi movida.
      Verifique o endereço e tente novamente.
    </p>
    <a th:href="@{/}" class="btn btn-primary btn-lg">
      <i class="bi bi-house-door me-2"></i>Ir para o Início
    </a>
  </div>
</div>
</th:block>
</html>
