<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<th:block th:fragment="content">
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <i class="bi bi-exclamation-triangle display-1 mb-3" style="color: var(--agn-orange);"></i>
    <h2>Ops! Algo deu errado.</h2>
    <p style="color: var(--agn-steel);" th:text="${errorMessage} ?: 'Ocorreu um erro inesperado. Tente novamente.'">
      Ocorreu um erro inesperado.
    </p>
    <div class="d-flex gap-2 justify-content-center">
      <a th:href="@{/}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i>Voltar ao Início
      </a>
      <button class="btn btn-outline-secondary" onclick="history.back()">
        <i class="bi bi-arrow-left me-1"></i>Voltar
      </button>
    </div>
  </div>
</div>
</th:block>
</html>
