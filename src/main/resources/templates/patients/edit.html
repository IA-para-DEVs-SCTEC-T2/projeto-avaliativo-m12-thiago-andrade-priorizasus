<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<th:block th:fragment="content">
<div class="row justify-content-center">
  <div class="col-lg-7">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
      <div>
        <h3 class="mb-1"><i class="bi bi-pencil-square me-2"></i>Editar Paciente</h2>
        <p class="mb-0" style="color: var(--agn-steel);">Atualize os dados cadastrais e clínicos principais.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-person-vcard me-2"></i>Dados do paciente</h5>
        <form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post" class="m-0"
              onsubmit="return confirm('Tem certeza que deseja excluir este paciente?');">
          <button type="submit" class="btn btn-sm btn-outline-danger">
            <i class="bi bi-trash me-1"></i>Excluir
          </button>
        </form>
      </div>
      <div class="card-body">
        <form th:action="@{/patients/{id}/update(id=${patient.id})}" th:object="${patient}" method="post">

          <div class="mb-3">
            <label for="name" class="form-label">Nome Completo <span style="color: var(--agn-error);">*</span></label>
            <input type="text" id="name" th:field="*{name}" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="cpf" class="form-label">CPF <span style="color: var(--agn-error);">*</span></label>
            <input type="text" id="cpf" th:field="*{cpf}"
                   class="form-control" required maxlength="14" data-cpf-mask
                   placeholder="000.000.000-00">
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label for="birthDate" class="form-label">Data de Nascimento <span style="color: var(--agn-error);">*</span></label>
              <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control" required th:max="${today}">
            </div>
            <div class="col-md-6">
              <label for="phone" class="form-label">Telefone</label>
              <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="(11) 99999-9999">
            </div>
            <div class="col-md-6">
              <label for="registrationDate" class="form-label">Cadastro</label>
              <input type="date" id="registrationDate" th:field="*{registrationDate}" class="form-control">
            </div>
            <div class="col-md-6">
              <label for="lastConsultationDate" class="form-label">Última Consulta</label>
              <input type="date" id="lastConsultationDate" th:field="*{lastConsultationDate}" class="form-control">
            </div>
          </div>

          <div class="mt-3 mb-3">
            <label for="address" class="form-label">Endereço</label>
            <textarea id="address" th:field="*{address}" class="form-control" rows="3"
                      placeholder="Rua, número, bairro, cidade"></textarea>
          </div>

          <div class="d-flex gap-2 flex-wrap">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Salvar Alterações
            </button>
            <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-outline-secondary">
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
</th:block>
</html>
