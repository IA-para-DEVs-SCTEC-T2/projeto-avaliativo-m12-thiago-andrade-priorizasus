<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<th:block th:fragment="content">
<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
  <div>
    <div class="d-flex align-items-center gap-2 mb-1">
      <h3 class="mb-0"><i class="bi bi-people me-2"></i>Pacientes</h3>
      <span class="badge-compact bg-light text-dark border" th:text="${patients != null ? #lists.size(patients) : 0} + ' registros'">0 registros</span>
    </div>
    <p class="mb-0 small" style="color: var(--agn-steel);">Lista limpa, leitura rápida e priorização visual consistente.</p>
  </div>
  <a th:href="@{/patients/new}" class="btn btn-primary align-self-start align-self-lg-center">
    <i class="bi bi-plus-lg me-1"></i>Novo Paciente
  </a>
</div>

<!-- Filter Bar -->
<div class="card mb-4">
  <div class="card-body">
    <form th:action="@{/patients}" method="get" class="row g-3 align-items-end">
      <div class="col-12 col-md-3">
        <label class="form-label mb-1">Categoria</label>
        <select name="category" class="form-select form-select-sm">
          <option value="">Todas</option>
          <option value="PRENATAL" th:selected="${filterCategory == 'PRENATAL'}">Pré-Natal</option>
          <option value="CHILD" th:selected="${filterCategory == 'CHILD'}">Puericultura</option>
          <option value="CHRONIC" th:selected="${filterCategory == 'CHRONIC'}">Crônico</option>
        </select>
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label mb-1">Busca</label>
        <input type="text" name="search" class="form-control form-control-sm"
               th:value="${filterSearch}" placeholder="Buscar por nome ou CPF" data-cpf-search-mask>
      </div>
      <div class="col-12 col-md-2 d-flex gap-2">
        <button type="submit" class="btn btn-sm btn-outline-primary flex-grow-1">
          <i class="bi bi-search me-1"></i>Filtrar
        </button>
        <a th:href="@{/patients}" class="btn btn-sm btn-ghost" style="color: var(--agn-steel);">
          <i class="bi bi-x-lg"></i>
        </a>
      </div>
    </form>
  </div>
</div>

<!-- Patient Card List -->
<div th:if="${patients != null && !patients.isEmpty()}">
  <div class="list-group list-group-flush">
    <a th:each="patient : ${patients}"
     th:href="@{/patients/{id}(id=${patient.id})}"
     class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 px-3 card-hover patient-list-item">
      <div class="d-flex align-items-center gap-3 flex-grow-1 min-width-0">
        <div class="d-flex align-items-center justify-content-center rounded-circle flex-shrink-0"
             style="width: 40px; height: 40px; background-color: var(--agn-tint-lavender); color: var(--agn-purple); font-weight: 600; font-size: 14px;"
             th:text="${patient.name != null && !patient.name.isEmpty() ? #strings.substring(patient.name, 0, 1) : '?'}">A</div>
        <div class="min-width-0">
          <div class="fw-semibold text-truncate" th:text="${patient.name}">Nome</div>
          <div class="small d-flex align-items-center gap-2 flex-wrap mt-1" style="color: var(--agn-steel);">
            <span th:with="raw=${patient.cpf != null ? patient.cpf.replaceAll('[^0-9]', '') : ''}">
              <span th:if="${#strings.length(raw) == 11}"
                    th:text="${#strings.substring(raw, 0, 3) + '.' + #strings.substring(raw, 3, 6) + '.' + #strings.substring(raw, 6, 9) + '-' + #strings.substring(raw, 9, 11)}">000.000.000-00</span>
              <span th:unless="${#strings.length(raw) == 11}"
                    th:text="${raw != '' ? raw : '---'}">---</span>
            </span>
          </div>
        </div>
      </div>
      <div class="d-flex gap-1 flex-shrink-0 flex-wrap justify-content-end" style="max-width: 220px;">
        <span th:each="cat : ${patient.categories}"
              class="agn-tag agn-tag-compact me-1"
              th:classappend="${cat.type.name() == 'PRENATAL'} ? 'agn-tag-pink' :
                              (${cat.type.name() == 'CHILD'} ? 'agn-tag-blue' : 'agn-tag-orange')"
              th:text="${cat.type.name() == 'PRENATAL'} ? 'Pré-Natal' :
                       (${cat.type.name() == 'CHILD'} ? 'Puericultura' : 'Crônico')">Cat</span>
        <span th:if="${patient.categories == null || patient.categories.isEmpty()}" class="small" style="color: var(--agn-steel);">Sem categoria</span>
      </div>
      <!-- Arrow -->
      <i class="bi bi-chevron-right flex-shrink-0" style="color: var(--agn-stone);"></i>
    </a>
  </div>
</div>

<!-- Empty State -->
<div class="card" th:unless="${patients != null && !patients.isEmpty()}">
  <div class="card-body text-center py-5">
    <i class="bi bi-inbox" style="font-size: 48px; color: var(--agn-muted);"></i>
    <h5 class="mt-3 mb-2" style="color: var(--agn-slate);">Nenhum paciente encontrado</h5>
    <p class="mb-4" style="color: var(--agn-steel); max-width: 360px; margin-left: auto; margin-right: auto;">
      Nenhum paciente corresponde aos filtros selecionados. Tente ajustar sua busca.
    </p>
    <a th:href="@{/patients/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i>Cadastrar Novo Paciente
    </a>
  </div>
</div>

</th:block>
</html>
