<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2><i class="bi bi-calendar-week me-2"></i>Grade de Horários</h2>
  <div class="btn-group">
    <a th:href="@{/staff/capacity(weekStart=${weekStart.minusDays(7)})}"
       class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-chevron-left"></i> Semana Anterior
    </a>
    <span class="btn btn-outline-secondary btn-sm disabled">
      Semana de <span th:text="${weekStartDisplay}">--/--/----</span>
    </span>
    <a th:href="@{/staff/capacity(weekStart=${weekStart.plusDays(7)})}"
       class="btn btn-outline-secondary btn-sm">
      Próxima Semana <i class="bi bi-chevron-right"></i>
    </a>
  </div>
</div>

<!-- Slot Grid -->
<th:block th:replace="~{fragments/slot-grid :: slotGrid(${slots}, ${weekStart}, ${weekStartDisplay}, ${dayHeaders}, ${timeHeaders}, ${showLinks}, ${slotColors})}"></th:block>
</th:block>
</html>
