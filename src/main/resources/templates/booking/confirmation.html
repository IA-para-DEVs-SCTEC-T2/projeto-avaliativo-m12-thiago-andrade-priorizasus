<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<th:block th:fragment="content">
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">

    <!-- Success -->
    <div th:if="${successMessage}" class="mb-4">
      <i class="bi bi-check-circle display-1" style="color: var(--agn-green);"></i>
      <h3 class="mt-3">Agendamento Confirmado!</h3>
      <p class="lead" style="color: var(--agn-slate);" th:text="${successMessage}">Sua consulta foi agendada.</p>
    </div>

    <!-- Error fallback -->
    <div th:if="${errorMessage}" class="mb-4">
      <i class="bi bi-x-circle display-1" style="color: var(--agn-error);"></i>
      <h3 class="mt-3">Ops!</h3>
      <p class="lead" style="color: var(--agn-slate);" th:text="${errorMessage}">Algo deu errado.</p>
    </div>

    <div class="card">
      <div class="card-body py-4">
        <p style="color: var(--agn-steel);">
          Compareça à Unidade de Saúde da Família na data e horário agendados.
          Leve um documento oficial com foto, o cartão do SUS, exames recentes e receitas ou prescrições médicas em uso.
        </p>
        <a th:href="@{/}" class="btn btn-primary btn-lg mt-3">
          <i class="bi bi-house-door me-2"></i>Voltar ao Início
        </a>
      </div>
    </div>

  </div>
</div>
</th:block>
</html>
