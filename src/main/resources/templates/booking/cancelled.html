<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<th:block th:fragment="content">
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">

    <i class="bi bi-check-circle display-1" style="color: var(--agn-yellow);"></i>
    <h3 class="mt-3">Agendamento Cancelado</h3>
    <p class="lead" style="color: var(--agn-slate);">
      Sua consulta foi cancelada. O horário foi liberado para outro paciente.
    </p>

    <div class="card mt-4">
      <div class="card-body py-4">
        <p style="color: var(--agn-steel); font-size: 14px;">
          <i class="bi bi-info-circle me-1"></i>
          Lembre-se: o cancelamento só é permitido até 1 dia antes da consulta.
          Se precisar de uma nova consulta, faça um novo cadastro na página inicial
          para entrar na próxima Seleção Semanal.
        </p>
        <a th:href="@{/}" class="btn btn-primary btn-lg mt-3">
          <i class="bi bi-house-door me-2"></i>Voltar ao Início
        </a>
      </div>
    </div>

  </div>
</div>
</th:block>
</html>
