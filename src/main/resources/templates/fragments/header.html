<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:fragment="header">
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">
      <i class="bi bi-calendar-heart me-2"></i>PriorizaSUS
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarMain" aria-controls="navbarMain"
            aria-expanded="false" aria-label="Alternar navegação">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">

      <!-- ===== PUBLIC NAV (not authenticated) ===== -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="!isAuthenticated()">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/}">
            <i class="bi bi-house-door me-1"></i>Início
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/booking/lookup}">
            <i class="bi bi-search me-1"></i>Consultar Agendamento
          </a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto mb-2 mb-lg-0" sec:authorize="!isAuthenticated()">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/auth/login}">
            <i class="bi bi-shield-lock me-1"></i>Login
          </a>
        </li>
      </ul>

      <!-- ===== STAFF NAV (authenticated admin) ===== -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="hasRole('ADMIN')">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/staff/dashboard}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/patients}">
            <i class="bi bi-people me-1"></i>Pacientes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/staff/weekly-selection}">
            <i class="bi bi-trophy me-1"></i>Seleção Semanal
          </a>
        </li>
        <!--/* Auditoria e Relatórios ficam ocultos nesta fase */-->
      </ul>

      <!-- ===== STAFF RIGHT SIDE: logout + user indicator ===== -->
      <ul class="navbar-nav ms-auto align-items-center" sec:authorize="hasRole('ADMIN')">
        <li class="nav-item d-flex align-items-center">
          <span class="navbar-text d-flex align-items-center me-2 mb-0 py-0" style="color: var(--agn-steel);">
            <i class="bi bi-person-check me-1"></i>
            <span sec:authentication="name">admin</span>
          </span>
        </li>
        <li class="nav-item d-flex align-items-center">
          <form th:action="@{/auth/logout}" method="post" class="d-flex align-items-center mb-0">
            <button type="submit" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-box-arrow-right me-1"></i>Sair
            </button>
          </form>
        </li>
      </ul>

    </div>
  </div>
</nav>
</th:block>
</html>
