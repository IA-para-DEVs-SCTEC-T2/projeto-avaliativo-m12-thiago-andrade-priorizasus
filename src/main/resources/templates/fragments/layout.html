<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'PriorizaSUS'">PriorizaSUS</title>

  <!-- Inter Font (Notion-Sans substitute) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">

  <!-- Bootstrap Icons (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

  <!-- PriorizaSUS Notion-inspired Design System -->
  <link th:href="@{/css/design-tokens.css}" rel="stylesheet">
  <link th:href="@{/css/agn-theme.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- Header / Navbar -->
  <th:block th:replace="~{fragments/header :: header}"></th:block>

  <!-- Main Content -->
  <main class="flex-grow-1">
    <div class="container-fluid py-3">
      <th:block th:replace="~{::content}"></th:block>
    </div>
  </main>

  <!-- Footer -->
  <th:block th:replace="~{fragments/footer :: footer}"></th:block>

  <!-- Bootstrap 5 JS Bundle (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous">
  </script>

  <!-- CPF Mask (formats as xxx.xxx.xxx-xx) -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('input[data-cpf-mask]').forEach(function(input) {
        input.addEventListener('input', function(e) {
          var value = e.target.value.replace(/\D/g, '');
          if (value.length > 11) value = value.slice(0, 11);
          if (value.length > 9) {
            value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
          } else if (value.length > 6) {
            value = value.replace(/^(\d{3})(\d{3})(\d{1,3})$/, '$1.$2.$3');
          } else if (value.length > 3) {
            value = value.replace(/^(\d{3})(\d{1,3})$/, '$1.$2');
          }
          e.target.value = value;
        });
      });
    });

    // Smart CPF mask for search fields: only formats when input is purely digits
    document.querySelectorAll('input[data-cpf-search-mask]').forEach(function(input) {
      input.addEventListener('input', function(e) {
        var raw = e.target.value;
        // Check if input is purely CPF-like (only digits, dots, dashes)
        var withoutFormat = raw.replace(/[\d.\-]/g, '');
        if (withoutFormat.length === 0) {
          var digits = raw.replace(/\D/g, '');
          if (digits.length > 11) digits = digits.slice(0, 11);
          if (digits.length > 9) {
            digits = digits.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
          } else if (digits.length > 6) {
            digits = digits.replace(/^(\d{3})(\d{3})(\d{1,3})$/, '$1.$2.$3');
          } else if (digits.length > 3) {
            digits = digits.replace(/^(\d{3})(\d{1,3})$/, '$1.$2');
          }
          e.target.value = digits;
        }
        // If input has letters, leave as-is (name search)
      });
    });
  </script>
</body>
</html>
