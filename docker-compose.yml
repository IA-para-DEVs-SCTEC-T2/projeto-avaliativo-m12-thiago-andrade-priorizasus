services:
  postgres:
    image: postgres:16-alpine
    container_name: priorizasus-postgres
    environment:
      POSTGRES_DB: priorizasus
      POSTGRES_USER: priorizasus
      POSTGRES_PASSWORD: priorizasus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priorizasus -d priorizasus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: priorizasus-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/priorizasus
      SPRING_DATASOURCE_USERNAME: priorizasus
      SPRING_DATASOURCE_PASSWORD: priorizasus
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE: UTC
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped