name: AI Build — Compile, Test & Format

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  spotless-check:
    name: Spotless Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Run Spotless check
        run: mvn spotless:check

  compile:
    name: Compile
    runs-on: ubuntu-latest
    needs: spotless-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile -q

  tests:
    name: Run Tests + Coverage
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Run all tests
        run: mvn test

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  coverage-threshold:
    name: JaCoCo Coverage Gate
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with coverage + enforce thresholds
        run: mvn test jacoco:report jacoco:check

  gate:
    name: Build Gate — All Checks Passed
    needs: [spotless-check, compile, tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          if [ "${{ needs.spotless-check.result }}" == "success" ] && \
             [ "${{ needs.compile.result }}" == "success" ] && \
             [ "${{ needs.tests.result }}" == "success" ]; then
            echo "✓ Build successful — all checks passed"
          else
            echo "::error::Build failed"
            echo "  spotless-check: ${{ needs.spotless-check.result }}"
            echo "  compile: ${{ needs.compile.result }}"
            echo "  tests: ${{ needs.tests.result }}"
            exit 1
          fi
