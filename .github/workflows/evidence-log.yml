name: AI Evidence Log — Formal Approval Traceability

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  extract-evidence:
    name: Extract REQ-IDs & Generate Approval Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Extract REQ-IDs from commit messages
        id: extract
        run: |
          echo "=== Extracting REQ-IDs from recent commits ==="
          # Get commits since last merge (up to 50)
          COMMITS=$(git log --format="%H %s" -50)

          echo "$COMMITS" | while read -r hash message; do
            # Extract REQ-IDs like PM-001, SA-003, etc.
            REQ_IDS=$(echo "$message" | grep -oP '\b(PM|CM|SA|BK|SD)-\d{3}\b' || true)
            if [ -n "$REQ_IDS" ]; then
              echo "Commit $hash: $REQ_IDS"
            fi
          done

          # Generate evidence JSON
          echo '[' > approval-evidence.json
          FIRST=true
          echo "$COMMITS" | while read -r hash message; do
            REQ_IDS=$(echo "$message" | grep -oP '\b(PM|CM|SA|BK|SD)-\d{3}\b' || true)
            if [ -n "$REQ_IDS" ]; then
              for req in $REQ_IDS; do
                if [ "$FIRST" = false ]; then echo ',' >> approval-evidence.json; fi
                FIRST=false
                TIMESTAMP=$(git log -1 --format="%aI" "$hash")
                echo "  {\"reqId\": \"$req\", \"commitHash\": \"${hash:0:7}\", \"timestamp\": \"$TIMESTAMP\", \"gate\": \"evidence-log\", \"status\": \"APPROVED\"}" >> approval-evidence.json
              done
            fi
          done
          echo ']' >> approval-evidence.json

          echo "=== Generated approval-evidence.json ==="
          cat approval-evidence.json

      - name: Update TRACEABILITY.md
        run: |
          echo "=== Updating TRACEABILITY.md with new evidence ==="
          # This step appends evidence rows to the traceability matrix
          # In production, this would use a script to parse @ReqId annotations
          # and update the correct rows in the matrix.
          echo "Evidence extraction complete. Check approval-evidence.json artifact."

      - name: Upload approval evidence
        uses: actions/upload-artifact@v4
        with:
          name: approval-evidence-${{ github.run_id }}
          path: approval-evidence.json

      - name: Upload traceability matrix
        uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix-${{ github.run_id }}
          path: docs/TRACEABILITY.md

  gate:
    name: Evidence Log Gate
    needs: [extract-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm evidence recorded
        run: |
          echo "✓ Approval evidence recorded for merge to main"
          echo "  REQ-IDs extracted from commit messages"
          echo "  Evidence artifact: approval-evidence-${{ github.run_id }}.json"
          echo "  Traceability matrix: docs/TRACEABILITY.md"
