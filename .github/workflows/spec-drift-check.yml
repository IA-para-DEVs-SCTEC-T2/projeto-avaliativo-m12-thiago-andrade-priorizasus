name: AI Spec Drift Check — Spec↔Code Semantic Alignment

on:
  workflow_call:
  pull_request:
    branches-ignore: [main]
    paths:
      - 'src/main/java/**/*.java'
      - '.specs/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  spec-drift-detection:
    name: SpecDriftDetectionTest — REQ-ID Traceability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Run SpecDriftDetectionTest
        id: drift-test
        run: mvn test -Dtest="SpecDriftDetectionTest" -DfailIfNoTests=false
        continue-on-error: true

      - name: Post drift report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read surefire test output
            const reportDir = 'target/surefire-reports';
            let driftWarnings = [];

            if (fs.existsSync(reportDir)) {
              const files = fs.readdirSync(reportDir);
              const txtFile = files.find(f => f.startsWith('TEST-com.priorizasus.priorizasus.harness.SpecDriftDetectionTest') && f.endsWith('.txt'));
              if (txtFile) {
                const content = fs.readFileSync(path.join(reportDir, txtFile), 'utf8');
                const lines = content.split('\n');
                driftWarnings = lines.filter(l => l.includes('SPEC DRIFT WARNING') || l.includes('SEMANTIC DRIFT WARNING'));
              }
            }

            const body = driftWarnings.length > 0
              ? `## ⚠️ Spec Drift Detection Report\n\n${driftWarnings.map(w => `- ${w.trim()}`).join('\n')}\n\n> Add \`@ReqId("XX-NNN")\` annotations to link code to specs. Run \`SpecDriftDetectionTest\` locally to verify.`
              : `## ✅ Spec Drift Detection — Clean\n\nAll REQ-IDs are traceable between specs and code. No drift detected.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  semantic-rule-check:
    name: Semantic Rule Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ADR-0001 — Pessimistic locking uses NOWAIT
        run: |
          echo "=== Checking FOR UPDATE NOWAIT compliance (ADR-0001) ==="
          FOR_UPDATE=$(grep -rn "FOR UPDATE" src/main/java/ 2>/dev/null | grep -v "FOR UPDATE NOWAIT" | grep -v "FOR UPDATE SKIP" || true)
          if [ -n "$FOR_UPDATE" ]; then
            echo "::error::FOR UPDATE without NOWAIT found — ADR-0001 requires NOWAIT"
            echo "$FOR_UPDATE"
            exit 1
          fi
          echo "✓ All FOR UPDATE clauses use NOWAIT"

      - name: Check UTC timezone configuration
        run: |
          echo "=== Checking UTC timezone config (ADR-0003) ==="
          if grep -q "hibernate.jdbc.time_zone=UTC" src/main/resources/application.properties; then
            echo "✓ UTC timezone configured"
          else
            echo "::error::UTC timezone not configured in application.properties"
            exit 1
          fi

  gate:
    name: Spec Drift Gate
    needs: [spec-drift-detection, semantic-rule-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          echo "spec-drift-detection: ${{ needs.spec-drift-detection.result }}"
          echo "semantic-rule-check: ${{ needs.semantic-rule-check.result }}"

          if [ "${{ needs.semantic-rule-check.result }}" == "success" ]; then
            echo "✓ Semantic rules consistent with ADRs"
          else
            echo "::error::Semantic rule check failed"
            exit 1
          fi

          # Drift detection is non-blocking during ramp-up
          if [ "${{ needs.spec-drift-detection.result }}" == "failure" ]; then
            echo "::warning::Spec drift detected — non-blocking during ramp-up. Add @ReqId annotations."
          fi
